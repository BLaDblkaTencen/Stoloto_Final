# Локальная база для разработки: docker compose up -d
# Если PostgreSQL уже установлен на ПК и занимает порт 5432, используйте его (см. README),
# а этот контейнер не запускайте.
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: sport
      POSTGRES_PASSWORD: sport
      POSTGRES_DB: sport
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sport -d sport']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
